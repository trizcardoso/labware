<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Envie seu Curriculo</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-color: #f4f4f9;
            flex-direction: column;
            padding: 20px;
        }

        .container-geral {
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
        }

        .upload-container {
            border: 2px dashed #ccc;
            padding: 15px;
            border-radius: 6px;
            text-align: center;
            margin: 20px 0;
            background-color: #fafafa;
        }

        input[type="text"],
        input[type="email"],
        input[type="date"] {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
            box-sizing: border-box;
        }

        .btn-salvar {
            margin-top: 10px;
            padding: 8px 14px;
            background-color: #28a745;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            width: 100%;
            font-weight: bold;
        }

        .btn-salvar:hover {
            background-color: #218838;
        }

        button[type="submit"] {
            width: 100%;
            padding: 10px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            margin-top: 10px;
        }

        button[type="submit"]:hover {
            background-color: #0056b3;
        }

        .voltar {
            font-size: 30px;
            text-decoration: none;
            color: black;
            top: 20px;
            left: 20px;
        }
    </style>
</head>

<body>

    <div class="container-geral">

        <a href="/frontend/html/Labware.html" class="voltar">
            ←
        </a>
        <div class="upload-container">
            <h3>1º Passo: Selecione e Salve o Arquivo</h3>
            <input type="file" id="meu-upload">
            <br>
            <button type="button" id="btn-escolher-local" class="btn-salvar">Escolher Pasta e Salvar</button>
            <p id="status-arquivo" style="font-size: 13px; color: #666; margin-top: 8px; font-weight: bold;"></p>
        </div>

        <form id="formulario">
            <h3>2º Passo: Preencha os Dados</h3>

            <label for="nome">Nome: </label>
            <input type="text" name="nome" placeholder="Nome" required>
            <br><br>

            <label for="email">Email: </label>
            <input type="email" name="email" placeholder="Email" required>
            <br><br>

            <label for="dataNascimento">Data de Nascimento: </label>
            <br>
            <input type="date" name="dataNascimento" required>
            <br><br>

            <label for="comentario">Comentário: </label>
            <input type="text" name="comentario" placeholder="Comentário" required>
            <br><br>

            <button type="submit">Enviar Formulário</button>
        </form>

    </div>

    <script src="/backend/enviarCurriculo.js"></script>

</body>

</html>
