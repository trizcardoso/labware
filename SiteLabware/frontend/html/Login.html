<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="/frontend/css/login.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=Inria+Serif:wght@400;700&display=swap"
        rel="stylesheet">
</head>

<body>

    <img src="/frontend/imagens/Dashboard.jpeg" alt="Dashboard" class="dashimg">
    <h1 class="dashtitulo"> Login</h1>
    <img src="/frontend/imagens/labware.webp" alt="Labware" class="dashlabware">
    <button class="botãovoltar">
        <a href="/frontend/html/Dashboard.html" class="textdec">Voltar</a>

    <form action="" class="loginForm" id="form">
        <label for="email"></label>
        <input type="email" id="email" placeholder="E-mail" class="inputform" />

        <label for="password"></label>
        <input type="password" id="password" placeholder="Senha" class="inputform" />
        <br>

        <button type="submit" class="entrardash">
            Entrar
        </button>
        <p>
            <a href="" class="esqueceusenha">Esqueceu sua senha?</a>
        </p>
    </form>


    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>

    <script src="/backend/login.js"></script>

</html>
